<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>האפליקציות של דינה</title>
<style>
:root{--bg:#F3F1F5;--surface:#fff;--ink:#1E1B24;--muted:#6A6475;--line:#DDD8E3;--accent:#6B3F86}
@media (prefers-color-scheme:dark){:root{--bg:#141217;--surface:#1E1B24;--ink:#EEEAF2;--muted:#A8A1B2;--line:#332E3B;--accent:#C9A2E0;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;margin:0 0 8px}
a.card{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card img{width:52px;height:52px;border-radius:12px}
a.card b{display:block;font-size:1.1rem}
a.card span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body><main>
<h1>האפליקציות של דינה</h1>
<a class="card" href="mazkira/"><img src="mazkira/icon-192.png" alt=""><div><b>מזקירה לך</b><span>מלווה אישית: משימות, כוחות ומילים טובות</span></div></a>
<a class="card" href="center/"><img src="center/icon-192.png" alt=""><div><b>המרכז של אשיה</b><span>ניהול פרויקטים, משימות, יומן, הרשמות וכספים</span></div></a>
</main></body>
</html>
