<body>
<title>ניהול המרכז של אשיה</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Heebo:wght@400;500;700&display=swap">
<style>
/* Layout: sticky header with overall progress and six tabs; one working column (max 1080px). Each domain owns one color, used on chips, task stripes and calendar dots. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#1B2230; --muted:#5C6677; --line:#D9DEE6;
  --accent:#6B3F86; --accent-ink:#FFFFFF; --accent-soft:#F0E8F5;
  --ok:#2E7A53; --ok-soft:#E3F2EA; --late:#B23A3A; --late-soft:#FBE6E6; --wait:#9A6A0C; --wait-soft:#FBF0DA; --doing:#2F64B5; --doing-soft:#E3ECF8;
  --d-mkt:#D0573F; --d-sales:#C88A12; --d-content:#2F64B5; --d-struct:#2E8A6A; --d-reg:#8A4BA8; --d-admin:#5D6B7E;
  --fin-in:#2F64B5; --fin-out:#D0573F;
  --display:"Rubik","Heebo","Segoe UI",Arial,sans-serif;
  --body:"Heebo","Assistant","Segoe UI",Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151B; --surface:#1B2029; --sunk:#161A22; --ink:#E9EDF3; --muted:#A1AABA; --line:#2D3442;
  --accent:#C9A2E0; --accent-ink:#1B1222; --accent-soft:#2E2438;
  --ok:#6DC796; --ok-soft:#1E3529; --late:#F08A8A; --late-soft:#3A2224; --wait:#E8B44E; --wait-soft:#3A2F1C; --doing:#7FA8EC; --doing-soft:#1F2C42;
  --d-mkt:#F08B74; --d-sales:#E8B44E; --d-content:#7FA8EC; --d-struct:#63C6A1; --d-reg:#C79BE0; --d-admin:#9EABBD;
  --fin-in:#5F8FDB; --fin-out:#D8604A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1B2029; --sunk:#161A22; --ink:#E9EDF3; --muted:#A1AABA; --line:#2D3442;
  --accent:#C9A2E0; --accent-ink:#1B1222; --accent-soft:#2E2438;
  --ok:#6DC796; --ok-soft:#1E3529; --late:#F08A8A; --late-soft:#3A2224; --wait:#E8B44E; --wait-soft:#3A2F1C; --doing:#7FA8EC; --doing-soft:#1F2C42;
  --d-mkt:#F08B74; --d-sales:#E8B44E; --d-content:#7FA8EC; --d-struct:#63C6A1; --d-reg:#C79BE0; --d-admin:#9EABBD;
  --fin-in:#5F8FDB; --fin-out:#D8604A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance;font-weight:600}
h1{font-size:1.25rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{min-width:0;max-width:100%}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:42px;text-align:start}
html,body{overflow-x:hidden;max-width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hin{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px 0}
.brand{display:flex;flex-direction:column;flex:1;min-width:200px}
.brand small{color:var(--muted);font-size:.78rem}
.meter{display:flex;align-items:center;gap:8px;min-width:170px}
.meter .bar{flex:1;min-width:100px}
.meter b{font-family:var(--display);font-variant-numeric:tabular-nums}
nav{display:flex;gap:2px;overflow-x:auto;max-width:100%;width:100%}
nav button{border:0;background:transparent;padding:8px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500;border-bottom:3px solid transparent}
nav button[aria-current="true"]{color:var(--ink);border-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding-block:18px 96px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.84rem} .num{font-variant-numeric:tabular-nums}
.btn{border:1px solid transparent;border-radius:999px;padding:8px 16px;background:var(--accent);color:var(--accent-ink);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:4px 12px;font-size:.84rem}
.btn.danger{background:transparent;color:var(--late);border-color:var(--line)}
.icon{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;line-height:1;text-decoration:none}
.icon:hover{background:var(--sunk);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.86rem;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface));font-weight:500}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;padding:1px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--muted)) 15%,var(--surface));color:var(--ink);white-space:nowrap}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag.own{background:var(--sunk);border:1px solid var(--line)}
.tag.doing{background:var(--doing-soft);color:var(--doing)}
.tag.waiting{background:var(--wait-soft);color:var(--wait)}
.tag.ms{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.filters{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:.78rem;color:var(--muted);min-width:44px}
select.sel{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);max-width:100%}
/* tasks */
.tasks{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 12px;border-radius:10px;background:var(--sunk);border-inline-start:4px solid var(--c,var(--muted))}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task.late{background:var(--late-soft)}
.task input[type=checkbox]{width:19px;height:19px;margin:2px 0 0;accent-color:var(--ok);cursor:pointer}
.ttl{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted);margin-top:3px}
.tnote{font-size:.8rem;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.acts{display:flex;gap:2px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.group h3{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.group{display:flex;flex-direction:column;gap:4px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dn{font-size:.78rem;color:var(--muted);text-align:center;padding-bottom:2px}
.day{min-height:84px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 5px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:start;min-width:0}
.day.out{opacity:.45}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.sel{background:var(--accent-soft)}
.day .n{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.day.today .n{color:var(--accent);font-weight:700}
.ev{font-size:.72rem;line-height:1.3;padding:1px 4px;border-radius:4px;background:color-mix(in srgb,var(--c) 18%,var(--surface));border-inline-start:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ev.done{text-decoration:line-through;opacity:.6}
.more{font-size:.7rem;color:var(--muted)}
@media (max-width:600px){.day{min-height:58px}.ev{font-size:0;height:6px;padding:0;border-inline-start-width:0;background:var(--c)}.day .evs{display:flex;flex-wrap:wrap;gap:2px}.day .evs .ev{width:6px;border-radius:50%}.more{display:none}}
/* projects */
.track{display:flex;flex-direction:column;gap:6px}
.track h3{display:flex;align-items:center;gap:8px}
.stages{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.stage{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px}
.stage:hover{background:var(--sunk)}
.stage input[type=checkbox]{width:18px;height:18px;accent-color:var(--c);cursor:pointer;flex:none}
.stage.done span{color:var(--muted);text-decoration:line-through}
.stage span{flex:1;min-width:0;overflow-wrap:anywhere}
.stage .icon{opacity:.35}
.stage:hover .icon,.stage:focus-within .icon{opacity:1}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.pcard{cursor:pointer;font:inherit;color:inherit}
.pcard:hover{border-color:var(--accent)}
.tracks{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.links{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.link{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.link .k{font-size:.7rem;color:var(--muted);background:var(--sunk);border-radius:4px;padding:1px 6px;margin-top:2px;white-space:nowrap}
.link a{font-weight:500;overflow-wrap:anywhere}
.journal{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.jent{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line)}
.jent time{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.jent p{white-space:pre-wrap;overflow-wrap:anywhere}
/* registrations */
.funnel{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.fstep{border-radius:10px;padding:10px;background:var(--sunk);border:1px solid var(--line);cursor:pointer;text-align:start;font:inherit;color:inherit}
.fstep[aria-pressed="true"]{border-color:var(--d-reg);background:color-mix(in srgb,var(--d-reg) 12%,var(--surface))}
.fstep b{display:block;font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.8rem;white-space:nowrap}
td select{padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
/* money */
.fin-in{color:var(--fin-in)} .fin-out{color:var(--fin-out)}
.legend{display:flex;gap:14px;font-size:.84rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:200px;border-bottom:1px solid var(--line);padding-top:18px;position:relative}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;cursor:default;position:relative;border-radius:6px}
.mcol:hover{background:var(--sunk)}
.pair{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.pair i{display:block;width:min(22px,40%);border-radius:4px 4px 0 0;min-height:1px}
.mlab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;font-size:.78rem;color:var(--muted);text-align:center}
.tip{position:absolute;bottom:calc(100% + 4px);background:var(--ink);color:var(--bg);font-size:.78rem;padding:6px 9px;border-radius:8px;white-space:nowrap;z-index:3;pointer-events:none;line-height:1.5}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.planned{opacity:.6}
/* forms */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
dialog form{min-width:0;max-width:100%}
.ffoot{position:sticky;bottom:0;z-index:2;background:var(--surface);margin:4px -18px -18px;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dclose{position:sticky;top:0;z-index:2;align-self:flex-end;margin:-6px -6px -40px 0;background:var(--surface)}
@media (max-width:520px){dialog{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;margin:0;border-radius:16px 16px 0 0;max-height:calc(var(--vvh,100vh) - 12px)}}
dialog::backdrop{background:rgba(10,12,18,.45)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:18px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk);color:var(--ink);width:100%}
.f textarea{min-height:70px;resize:vertical}
.frow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr))}
.frow>*,dialog form>*{min-width:0}
@media (max-width:520px){.frow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:20}
.note{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<header class="gut">
  <div class="hin">
    <div class="brand"><h1>המרכז של אשיה</h1><small>תרפיית המפגש לזוגות · לוח ניהול</small></div>
    <div class="meter" title="אחוז המשימות והשלבים שהושלמו"><span class="small muted">התקדמות</span><div class="bar"><i id="hBar" style="width:0%"></i></div><b id="hPct">0%</b></div>
    <nav id="nav" aria-label="מסכים">
      <button data-v="home" aria-current="true">סקירה</button>
      <button data-v="projects">פרויקטים</button>
      <button data-v="day">סיכום יומי</button>
      <button data-v="tasks">משימות</button>
      <button data-v="calendar">יומן</button>
      <button data-v="regs">הרשמות</button>
      <button data-v="money">הכנסות והוצאות</button>
    </nav>
  </div>
</header>
<main class="gut" id="main"><div class="empty">טוען את נתוני המרכז…</div></main>

<dialog id="dlg"><form id="dform" method="dialog"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- constants ---------- */
const DOMAINS=[
  {k:'mkt',n:'שיווק',c:'var(--d-mkt)'},
  {k:'sales',n:'מכירות',c:'var(--d-sales)'},
  {k:'content',n:'תוכן',c:'var(--d-content)'},
  {k:'struct',n:'מבנה ותשתית',c:'var(--d-struct)'},
  {k:'reg',n:'הרשמות',c:'var(--d-reg)'},
  {k:'admin',n:'ניהול',c:'var(--d-admin)'}
];
const DM=Object.fromEntries(DOMAINS.map(d=>[d.k,d]));
const TRACKS=['content','struct','mkt','sales'];
const TEMPLATES={
  content:['רעיון ומטרות','ראשי פרקים','כתיבה','הקלטה וצילום','עריכה','אישור של אשיה','העלאה לפלטפורמה'],
  struct:['אפיון','מבנה מודולים ושלבים','בחירת פלטפורמה וכלים','תמחור','פיילוט ובדיקה','מוכן להשקה'],
  mkt:['קהל יעד ומסרים','דף נחיתה','תוכן חינמי / מגנט','רשימת תפוצה ומיילים','קמפיין ברשתות','השקה','מעקב תוצאות'],
  sales:['לידים','שיחת היכרות / וובינר','הצעה ומחיר','סגירה ותשלום','קליטה ופתיחה','שימור והמלצות']
};
const PSTATUS=[{k:'idea',n:'רעיון'},{k:'active',n:'בעבודה'},{k:'launch',n:'בהשקה'},{k:'live',n:'פעיל'},{k:'ongoing',n:'שוטף'},{k:'paused',n:'מושהה'},{k:'done',n:'הסתיים'}];
const TSTATUS=[{k:'todo',n:'לביצוע'},{k:'doing',n:'בעבודה'},{k:'waiting',n:'ממתין'},{k:'done',n:'בוצע'}];
const OWNERS=['דינה','אשיה','איתי','משותף'];
const RSTATUS=[{k:'lead',n:'התעניינות'},{k:'call',n:'שיחת היכרות'},{k:'reg',n:'נרשם/ה'},{k:'paid',n:'שולם'},{k:'started',n:'התחיל/ה'},{k:'lost',n:'לא רלוונטי'}];
const INCAT=['הכשרה','אינטנסיב זוגי','קורס דיגיטלי','ספר הלב','הדרכות וסדנאות','מועדון בוגרים','אחר'];
const OUTCAT=['פרסום ממומן','קמפיינר ושיווק','צוות ושכר','פלטפורמות ותוכנות','צילום ועריכה','מקום והפקה','הנהלת חשבונות','אחר'];
const LKINDS=[{k:'doc',n:'מסמך'},{k:'folder',n:'תיקייה'},{k:'link',n:'קישור'}];
const DAYS=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const COLS=['projects','tasks','regs','links','journal','money','daylog','notes'];
const AUD_DEFAULT=`הקהל של ההכשרות וההדרכות המקצועיות (הוגדר על ידי דינה, 22.11.2026):

• בכירים, מטפלים מנוסים
• מורים, מכשירים בעצמם הכשרות מטפלים
• יודעים מה הם רוצים
• צריכים את הייחודיות והשפה האישית
• לא קלישאתי

המסר: זה לא שטאנץ. זה שונה ממה שעשיתי עד עכשיו, ולא מתיימר. אני לא הולכת לחדש לכם.

איך כותבים להם: בגובה העיניים, כמו לעמיתים. בלי להסביר יסודות, בלי הבטחות גדולות ובלי סופרלטיבים. מראים את מה שייחודי בדרך של אשיה, לא "חדש".`;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ds(d)};
const fmtDate=s=>{if(!s)return'';const d=parse(s);return DAYS[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+(d.getFullYear()!==new Date().getFullYear()?'.'+String(d.getFullYear()).slice(2):'')};
const shortDate=s=>{if(!s)return'';const d=parse(s);return d.getDate()+'.'+(d.getMonth()+1)+(d.getFullYear()!==new Date().getFullYear()?'.'+String(d.getFullYear()).slice(2):'')};
const nis=n=>'₪'+Math.round(Number(n||0)).toLocaleString('he-IL');
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
const ls={get(k,d){try{const v=localStorage.getItem('ashia-c-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ashia-c-'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- state + storage ---------- */
const S=Object.fromEntries(COLS.map(c=>[c,{}]));
const UI={day:today(),view:ls.get('view','home'),dom:'all',owner:ls.get('owner','all'),proj:'all',tstat:'open',month:null,sel:today(),open:null,rstat:'all',rprog:'all',showDone:false,fmonth:today().slice(0,7),mtype:'all'};
let db=null, mode='local', loaded=false;
const LKEY='ashia-center-v1';
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LKEY)||'null');if(v)COLS.forEach(c=>{if(v[c])S[c]=v[c]})}catch(e){}}
async function put(col,obj,quiet){
  obj.updatedAt=Date.now(); S[col][obj.id]=obj; if(!quiet)render();
  if(mode==='db'){try{await db.collection(col).doc(obj.id).set(obj)}catch(e){toast(e?.code==='not_granted'?'אין לך הרשאת עריכה באפליקציה הזו':'השמירה לא הצליחה. נסי שוב בעוד רגע.')}}
  else saveLocal();
}
async function del(col,id){
  delete S[col][id]; render();
  if(mode==='db'){try{await db.collection(col).doc(id).delete()}catch(e){toast('המחיקה לא הצליחה.')}}
  else saveLocal();
}
const list=col=>Object.values(S[col]);

async function boot(){
  const timer=setTimeout(()=>{if(!loaded){mode='local';loadLocal();loaded=true;render()}},10000);
  try{ db=window.claude?.use? await window.claude.use('db'):null }catch(e){db=null}
  if(!db){clearTimeout(timer);mode='local';loadLocal();loaded=true;render();return}
  mode='db'; const got=new Set();
  COLS.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{const v=d.data();if(v)o[d.id]={...v,id:d.id}});S[col]=o;
      got.add(col); if(got.size>=COLS.length&&!loaded){clearTimeout(timer);loaded=true}
      render();
    },err=>{clearTimeout(timer);if(!loaded){mode='local';loadLocal();loaded=true;render()}});
  });
}

/* ---------- derived ---------- */
const tstat=t=>t.done?'done':(t.status&&t.status!=='done'?t.status:'todo');
const projTasks=id=>list('tasks').filter(t=>t.project===id);
function projCounts(p){let t=0,d=0;TRACKS.forEach(k=>(p.tracks?.[k]||[]).forEach(s=>{t++;if(s.done)d++}));projTasks(p.id).forEach(x=>{t++;if(x.done)d++});return{t,d}}
function projProgress(p){const {t,d}=projCounts(p);return t?Math.round(d/t*100):0}
function trackNext(p,k){const s=p.tracks?.[k]||[];if(!s.length)return'';const n=s.find(x=>!x.done);return n?n.name:'הושלם'}
function nextTask(p){return projTasks(p.id).filter(t=>!t.done).sort(sortTasks)[0]}
const pname=id=>S.projects[id]?.name||'';
const sortedProjects=()=>list('projects').sort((a,b)=>(a.order??99)-(b.order??99));
function taskMatches(t){return (UI.dom==='all'||t.domain===UI.dom)&&(UI.owner==='all'||t.owner===UI.owner||(UI.owner!=='משותף'&&t.owner==='משותף'&&false))}
function sortTasks(a,b){return (a.date||'9999').localeCompare(b.date||'9999')||(a.step||99)-(b.step||99)||(a.time||'99').localeCompare(b.time||'99')}
function sortByStep(a,b){return (a.done-b.done)||((a.step||99)-(b.step||99))||sortTasks(a,b)}

/* ---------- small renderers ---------- */
const dtag=k=>{const d=DM[k]||DM.admin;return `<span class="tag" style="--c:${d.c}"><span class="dot"></span>${d.n}</span>`};
function taskRow(t,opt={}){
  const d=DM[t.domain]||DM.admin, st=tstat(t), late=!t.done&&t.date&&t.date<today();
  const when=t.date?fmtDate(t.date)+(t.time?' · '+t.time:''):'';
  const link=safeUrl(t.link);
  return `<li class="task ${t.done?'done':''} ${late?'late':''}" style="--c:${d.c}">
    <input type="checkbox" aria-label="סימון כבוצע" data-act="toggle" data-id="${t.id}" ${t.done?'checked':''}>
    <div><div class="ttl">${t.step&&opt.step?`<span class="muted num">${t.step}. </span>`:''}${esc(t.title)}</div>
      <div class="meta">${when?`<span class="num">${late?'באיחור · ':''}${when}</span>`:''}
        ${t.owner?`<span class="tag own">${esc(t.owner)}</span>`:''}
        ${st==='doing'?'<span class="tag doing">בעבודה</span>':st==='waiting'?'<span class="tag waiting">ממתין</span>':''}
        ${t.milestone?'<span class="tag ms">ציון דרך</span>':''}
        ${dtag(t.domain)}${t.project&&!opt.noProj?`<span>${esc(pname(t.project))}</span>`:''}
        ${link?`<a href="${esc(link)}" target="_blank" rel="noopener">${esc(t.linkTitle||'מסמך')}</a>`:''}</div>
      ${t.notes&&opt.notes?`<div class="tnote">${esc(t.notes)}</div>`:''}</div>
    <div class="acts">${t.date&&!t.done?`<a class="icon" title="הוספה ליומן גוגל" aria-label="הוספה ליומן גוגל" href="${gcal(t)}" target="_blank" rel="noopener">📅</a>`:''}
      ${t.audio?`<button class="icon" data-act="play" data-path="${esc(t.audio)}" aria-label="השמעת ההקלטה" title="השמעת ההקלטה">▶</button>`:''}
      <button class="icon" data-act="edit-task" data-id="${t.id}" aria-label="עריכה" title="עריכה">✎</button></div>
  </li>`;
}
const taskList=(arr,emptyTxt,opt)=>arr.length?`<ul class="tasks">${arr.map(t=>taskRow(t,opt)).join('')}</ul>`:(emptyTxt?`<div class="empty">${emptyTxt}</div>`:'');
function domChips(){
  return `<div class="row" role="group" aria-label="סינון לפי תחום"><span class="flabel">תחום</span>
    <button class="chip" data-act="dom" data-k="all" aria-pressed="${UI.dom==='all'}">הכול</button>
    ${DOMAINS.map(d=>`<button class="chip" style="--c:${d.c}" data-act="dom" data-k="${d.k}" aria-pressed="${UI.dom===d.k}"><span class="dot"></span>${d.n}</button>`).join('')}
  </div>`;
}
function ownerChips(){
  return `<div class="row" role="group" aria-label="סינון לפי אחראית"><span class="flabel">של מי</span>
    <button class="chip" data-act="owner" data-k="all" aria-pressed="${UI.owner==='all'}">כולם</button>
    ${OWNERS.map(o=>`<button class="chip" data-act="owner" data-k="${o}" aria-pressed="${UI.owner===o}">${o}</button>`).join('')}
  </div>`;
}
function linkRow(l){
  const u=safeUrl(l.url);
  return `<li class="link"><span class="k">${(LKINDS.find(k=>k.k===l.kind)||LKINDS[2]).n}</span>
    <div style="min-width:0">${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l.title)}</a>`:`<b>${esc(l.title)}</b>`}
    ${l.summary?`<div class="note">${esc(l.summary)}</div>`:''}</div>
    <button class="icon" data-act="edit-link" data-id="${l.id}" aria-label="עריכה">✎</button></li>`;
}
function journalList(arr){
  return arr.length?`<ul class="journal">${arr.map(j=>`<li class="jent"><time>${shortDate(j.date)}</time><div style="min-width:0"><p>${esc(j.text)}</p>${j.project?`<span class="note">${esc(pname(j.project))}</span>`:''}</div><button class="icon" data-act="edit-j" data-id="${j.id}" aria-label="עריכה">✎</button></li>`).join('')}</ul>`
  :`<div class="empty">היומן ריק. כל רשומה מתעדת רגע בהתקדמות: מה קרה, מה הוחלט, מה למדנו.</div>`;
}

/* ---------- views ---------- */
function vHome(){
  const t0=today(), wk=addDays(t0,7);
  const all=list('tasks').filter(taskMatches);
  const open=all.filter(t=>!t.done);
  const late=open.filter(t=>t.date&&t.date<t0).sort(sortTasks);
  const tday=open.filter(t=>t.date===t0).sort(sortTasks);
  const week=open.filter(t=>t.date>t0&&t.date<=wk).sort(sortTasks);
  const waiting=open.filter(t=>tstat(t)==='waiting');
  const doneWeek=all.filter(t=>t.done&&t.doneAt&&t.doneAt>Date.now()-7*864e5).length;
  const ms=open.filter(t=>t.milestone).sort(sortTasks).slice(0,6);
  const projs=sortedProjects().filter(p=>p.status!=='done');
  const jr=list('journal').sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
  const mo=today().slice(0,7), mm=list('money').filter(m=>!m.planned&&(m.date||'').startsWith(mo));
  const inc=mm.filter(m=>m.type==='in').reduce((s,m)=>s+Number(m.amount||0),0), out=mm.filter(m=>m.type==='out').reduce((s,m)=>s+Number(m.amount||0),0);
  return `
  ${ownerChips()}
  <div class="stats">
    <div class="card stat"><span class="muted small">משימות פתוחות</span><b>${open.length}</b></div>
    <div class="card stat"><span class="muted small">בוצעו השבוע</span><b style="color:var(--ok)">${doneWeek}</b></div>
    <div class="card stat"><span class="muted small">באיחור</span><b style="color:${late.length?'var(--late)':'inherit'}">${late.length}</b></div>
    <div class="card stat"><span class="muted small">ממתינות לגורם אחר</span><b>${waiting.length}</b></div>
    <button class="card stat pcard" style="text-align:start" data-act="go" data-v="money"><span class="muted small">יתרה ב${MONTHS[new Date().getMonth()]}</span><b class="num">${nis(inc-out)}</b><span class="note num"><span class="fin-in">הכנסות ${nis(inc)}</span> · <span class="fin-out">הוצאות ${nis(out)}</span></span></button>
  </div>
  <div class="two">
    <section class="card"><div class="row between"><h2>מה על הפרק${UI.owner!=='all'?' · '+UI.owner:''}</h2><div class="row">${voiceBtn()}<button class="btn sm" data-act="new-task">+ משימה</button></div></div>
      ${late.length?`<h3 style="color:var(--late)">באיחור (${late.length})</h3>${taskList(late)}`:''}
      <h3>היום</h3>${taskList(tday,'אין משימות להיום.')}
      <h3>בשבוע הקרוב</h3>${taskList(week,'אין משימות מתוזמנות לשבוע הקרוב.')}
      ${waiting.length?`<h3>ממתינות</h3>${taskList(waiting)}`:''}
      <button class="btn sm ghost" style="align-self:flex-start" data-act="go" data-v="tasks">לכל המשימות</button>
    </section>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <section class="card"><div class="row between"><h2>התקדמות הפרויקטים</h2><button class="btn sm ghost" data-act="go" data-v="projects">לפרויקטים</button></div>
      ${projs.length?projs.map(p=>{const pr=projProgress(p),c=projCounts(p);return `<button class="pcard card" style="padding:10px 12px;text-align:start;gap:6px" data-act="open-proj" data-id="${p.id}">
        <div class="row between"><b>${esc(p.name)}</b><span class="num small muted">${c.d}/${c.t}</span></div>
        <div class="bar"><i style="width:${pr}%"></i></div></button>`}).join('')
        :`<div class="empty">עוד אין פרויקטים. <button class="btn sm" data-act="new-proj">+ פרויקט ראשון</button></div>`}
    </section>
    <section class="card"><h2>ציוני דרך קרובים</h2>${taskList(ms,'אין ציוני דרך פתוחים.')}</section>
    </div>

  ${dayCard()}
  <div class="two">
    <section class="card"><div class="row between"><h2>יומן התקדמות</h2><button class="btn sm" data-act="new-j">+ תיעוד</button></div>${journalList(jr)}</section>
    <section class="card"><div class="row between"><h2>הרשמות לפי שלב</h2><button class="btn sm ghost" data-act="go" data-v="regs">להרשמות</button></div>${funnelHTML(false)}</section>
  </div>
  ${mode==='local'?`<p class="note">הנתונים נשמרים בדפדפן הזה בלבד, כי השמירה המשותפת לא זמינה כרגע.</p>`:''}`;
}

/* daily summary */
const doneOn=d=>list('tasks').filter(t=>t.done&&t.doneAt&&ds(new Date(t.doneAt))===d);
const dayEntries=d=>list('daylog').filter(e=>e.date===d);
function dayItems(d){
  const own=x=>UI.owner==='all'||x===UI.owner;
  const a=dayEntries(d).filter(e=>own(e.who)).map(e=>({k:'e',ts:e.createdAt||0,e}));
  const b=doneOn(d).filter(t=>own(t.owner)).map(t=>({k:'t',ts:t.doneAt,t}));
  return [...a,...b].sort((x,y)=>x.ts-y.ts);
}
function dayItemRow(it){
  if(it.k==='t'){const t=it.t,dm=DM[t.domain]||DM.admin;return `<li class="task done" style="--c:${dm.c}"><span style="color:var(--ok);font-weight:700">✓</span><div><div class="ttl" style="text-decoration:none;color:inherit">${esc(t.title)}</div><div class="meta"><span class="tag">משימה שסומנה</span>${t.owner?`<span class="tag own">${esc(t.owner)}</span>`:''}${dtag(t.domain)}${t.project?`<span>${esc(pname(t.project))}</span>`:''}</div></div><span></span></li>`}
  const e=it.e,dm=DM[e.domain]||DM.admin;
  return `<li class="task" style="--c:${dm.c}"><span style="color:var(--accent);font-weight:700">●</span><div><div class="ttl">${esc(e.text)}</div><div class="meta">${e.who?`<span class="tag own">${esc(e.who)}</span>`:''}${e.domain?dtag(e.domain):''}${e.project?`<span>${esc(pname(e.project))}</span>`:''}${e.minutes?`<span class="num">${e.minutes} דק׳</span>`:''}</div></div>
    <div class="acts"><button class="icon" data-act="edit-day" data-id="${e.id}" aria-label="עריכה">✎</button></div></li>`;
}
function quickDayForm(d,idp){
  return `<form class="qd" data-date="${d}" style="display:flex;flex-direction:column;gap:8px">
    <label class="f" for="${idp}-text">מה עשית<textarea id="${idp}-text" name="text" required style="min-height:60px" placeholder="למשל: שיחה עם קמפיינר על תקציב דצמבר, ניסחתי פוסט לבלוג"></textarea></label>
    <div class="row"><select class="sel" name="who" id="${idp}-who" aria-label="מי">${OWNERS.map(o=>`<option ${o===(UI.owner!=='all'?UI.owner:'דינה')?'selected':''}>${o}</option>`).join('')}</select>
      <select class="sel" name="project" id="${idp}-proj" aria-label="פרויקט">${projOpts('')}</select>
      <select class="sel" name="domain" id="${idp}-dom" aria-label="תחום"><option value="">תחום</option>${DOMAINS.map(x=>`<option value="${x.k}">${x.n}</option>`).join('')}</select>
      <button class="btn sm" type="submit">הוספה לסיכום</button></div></form>`;
}
function dayCard(){
  const d=today(), items=dayItems(d).filter(i=>!(i.k==='e'&&i.e.isNote));
  return `<section class="card"><div class="row between"><h2>היום נעשה${UI.owner!=='all'?' · '+UI.owner:''}</h2><button class="btn sm ghost" data-act="go" data-v="day">לסיכום היומי</button></div>
    ${items.length?`<ul class="tasks">${items.slice(-6).map(dayItemRow).join('')}</ul>${items.length>6?`<p class="note">ועוד ${items.length-6} בסיכום היומי</p>`:''}`:'<p class="note">עוד לא נרשם כלום היום. כל מה שעשית נכנס כאן, גם אם לא הייתה עליו משימה.</p>'}
    ${quickDayForm(d,'qh')}</section>`;
}
function vDay(){
  const d=UI.day, items=dayItems(d), dt=parse(d);
  const note=list('daylog').find(e=>e.id==='note-'+d);
  const entries=items.filter(i=>i.k==='e'&&!i.e.isNote);
  const week=[...Array(7)].map((_,i)=>addDays(d,i-6));
  return `<div class="row between"><h2>סיכום יומי</h2>${voiceBtn().replace('data-act="voice"','data-act="voice-day"').replaceAll('משימה בקול','סיכום בקול')}</div>
  ${ownerChips()}
  <div class="row"><button class="icon" data-act="day" data-n="-1" aria-label="יום קודם">→</button><h3 style="min-width:150px;text-align:center">${fmtDate(d)} ${MONTHS[dt.getMonth()]}</h3><button class="icon" data-act="day" data-n="1" aria-label="יום הבא">←</button><button class="btn sm ghost" data-act="day" data-n="0">היום</button>
    <span class="note num">${entries.length} רישומים · ${items.filter(i=>i.k==='t').length} משימות שסומנו</span></div>
  <div class="two">
    <section class="card"><h2>מה נעשה</h2>
      ${items.filter(i=>!(i.k==='e'&&i.e.isNote)).length?`<ul class="tasks">${items.filter(i=>!(i.k==='e'&&i.e.isNote)).map(dayItemRow).join('')}</ul>`:'<div class="empty">עוד אין רישומים ליום הזה.</div>'}
      ${quickDayForm(d,'qd')}
    </section>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <section class="card"><h2>הערות ליום</h2>
      <label class="f" for="day-note">תובנות, החלטות, מה להמשיך מחר<textarea id="day-note" data-act="daynote" data-date="${d}" style="min-height:120px">${esc(note?.text||'')}</textarea></label>
      <p class="note">נשמר אוטומטית כשיוצאים מהתיבה.</p></section>
    <section class="card"><h2>השבוע</h2>
      ${week.map(w=>{const n=dayItems(w).filter(i=>!(i.k==='e'&&i.e.isNote)).length;return `<button class="row between pcard" style="border:0;background:${w===d?'var(--accent-soft)':'transparent'};padding:6px 8px;border-radius:8px;text-align:start" data-act="day-go" data-d="${w}"><span>${fmtDate(w)}</span><span class="num muted">${n?n+' פריטים':'—'}</span></button>`}).join('')}
    </section></div>
  </div>
  ${dayChart(d)}`;
}
function weekOf(d){const x=parse(d);return addDays(d,-x.getDay())}
function dayChart(d){
  const w0=weekOf(d), weeks=[...Array(8)].map((_,i)=>addDays(w0,(i-7)*7));
  const data=weeks.map(w=>{let m=0,t=0,min=0;for(let i=0;i<7;i++){const it=dayItems(addDays(w,i)).filter(x=>!(x.k==='e'&&x.e.isNote));it.forEach(x=>{if(x.k==='e'){m++;min+=Number(x.e.minutes)||0}else t++})}return {w,m,t,min}});

function vCalendar(){

  const first=new Date(y,mo-1,1), start=new Date(first); start.setDate(1-first.getDay());
  const tasks=list('tasks').filter(taskMatches);
  const byDay={}; tasks.forEach(t=>{if(t.date)(byDay[t.date]=byDay[t.date]||[]).push(t)});
  let cells=''; const t0=today();
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=ds(d);
    if(i===35&&d.getMonth()!==mo-1)break;
    const ev=(byDay[k]||[]).sort(sortTasks);
    cells+=`<button class="day ${d.getMonth()!==mo-1?'out':''} ${k===t0?'today':''} ${k===UI.sel?'sel':''}" data-act="sel" data-d="${k}" aria-label="${d.getDate()} ${MONTHS[d.getMonth()]}, ${ev.length} משימות">
      <span class="n">${d.getDate()}</span><span class="evs">${ev.slice(0,3).map(t=>`<span class="ev ${t.done?'done':''}" style="--c:${(DM[t.domain]||DM.admin).c}">${esc(t.time?t.time+' ':'')}${esc(t.title)}</span>`).join('')}</span>${ev.length>3?`<span class="more">ועוד ${ev.length-3}</span>`:''}</button>`}
  const dayT=(byDay[UI.sel]||[]).sort(sortTasks);
  const upcoming=tasks.filter(t=>!t.done&&t.date&&t.date>=t0).sort(sortTasks);
  const undated=tasks.filter(t=>!t.date&&!t.done).length;
  return `<div class="row between"><h2>יומן</h2><div class="row"><button class="btn ghost sm" data-act="ics">ייצוא ליומן (‎.ics)</button>${voiceBtn()}<button class="btn" data-act="new-task">+ משימה</button></div></div>

  <div class="two">

      <div class="row between"><button class="icon" data-act="month" data-n="-1" aria-label="חודש קודם">→</button>
        <h3>${MONTHS[mo-1]} ${y}</h3>
        <div class="row" style="gap:2px"><button class="btn sm ghost" data-act="month" data-n="0">היום</button><button class="icon" data-act="month" data-n="1" aria-label="חודש הבא">←</button></div></div>
      <div class="cal">${DAYS.map(d=>`<span class="dn">${d}</span>`).join('')}${cells}</div>
      ${undated?`<p class="note">${undated} משימות פתוחות עוד בלי תאריך. אפשר לתזמן אותן ממסך המשימות.</p>`:''}

      ${taskList(dayT,'אין משימות ביום הזה.')}

      ${taskList(upcoming.slice(0,10),'אין משימות קרובות.')}

  </div>`;
}

/* money */
const sum=(arr,type)=>arr.filter(m=>m.type===type).reduce((s,m)=>s+Number(m.amount||0),0);
function monthKey(off){const [y,m]=UI.fmonth.split('-').map(Number);const d=new Date(y,m-1+off,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
const mName=k=>{const [y,m]=k.split('-').map(Number);return MONTHS[m-1]+' '+y};
function vMoney(){
  const all=list('money'), real=all.filter(m=>!m.planned);
  const mk=UI.fmonth, inMonth=all.filter(m=>(m.date||'').startsWith(mk));
  const realM=inMonth.filter(m=>!m.planned), planM=inMonth.filter(m=>m.planned);
  const yr=mk.slice(0,4), realY=real.filter(m=>(m.date||'').startsWith(yr));
  const iM=sum(realM,'in'),oM=sum(realM,'out'),iY=sum(realY,'in'),oY=sum(realY,'out');
  // chart: 6 months ending at selected month
  const months=[-5,-4,-3,-2,-1,0].map(monthKey);
  const data=months.map(k=>{const r=real.filter(m=>(m.date||'').startsWith(k));return{k,i:sum(r,'in'),o:sum(r,'out')}});
  const max=Math.max(1,...data.flatMap(d=>[d.i,d.o]));
  const cats=type=>{const o={};realM.filter(m=>m.type===type).forEach(m=>{o[m.cat||'אחר']=(o[m.cat||'אחר']||0)+Number(m.amount||0)});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
  const byProj={};realY.forEach(m=>{const k=m.project&&S.projects[m.project]?m.project:'';(byProj[k]=byProj[k]||{i:0,o:0})[m.type==='in'?'i':'o']+=Number(m.amount||0)});
  const rows=inMonth.filter(m=>UI.mtype==='all'||m.type===UI.mtype).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const catBlock=(type,label,cls)=>{const c=cats(type),tot=c.reduce((s,x)=>s+x[1],0);return `<div style="min-width:0"><h3 class="${cls}" style="margin-bottom:6px">${label}</h3>${c.length?c.map(([n,v])=>`<div class="row between small"><span>${esc(n)}</span><span class="amt">${nis(v)}</span></div><div class="bar" style="height:5px;margin-bottom:6px"><i style="width:${Math.round(v/tot*100)}%;background:var(--fin-${type})"></i></div>`).join(''):'<p class="note">אין רישומים החודש.</p>'}</div>`};
  return `<div class="row between"><h2>הכנסות והוצאות</h2><div class="row"><button class="btn ghost sm" data-act="csv">ייצוא לאקסל (CSV)</button><button class="btn" data-act="new-money" data-t="in">+ הכנסה</button><button class="btn" style="background:var(--fin-out);color:#fff" data-act="new-money" data-t="out">+ הוצאה</button></div></div>
  <div class="row"><button class="icon" data-act="fmonth" data-n="-1" aria-label="חודש קודם">→</button><h3 style="min-width:130px;text-align:center">${mName(mk)}</h3><button class="icon" data-act="fmonth" data-n="1" aria-label="חודש הבא">←</button><button class="btn sm ghost" data-act="fmonth" data-n="0">החודש</button></div>
  <div class="stats">
    <div class="card stat"><span class="muted small">הכנסות החודש</span><b class="fin-in">${nis(iM)}</b></div>
    <div class="card stat"><span class="muted small">הוצאות החודש</span><b class="fin-out">${nis(oM)}</b></div>
    <div class="card stat"><span class="muted small">יתרה החודש</span><b style="color:${iM-oM<0?'var(--late)':'var(--ok)'}">${nis(iM-oM)}</b></div>
    <div class="card stat"><span class="muted small">מתחילת ${yr}</span><b>${nis(iY-oY)}</b><span class="note num"><span class="fin-in">${nis(iY)}</span> · <span class="fin-out">${nis(oY)}</span></span></div>
    ${planM.length?`<div class="card stat"><span class="muted small">צפוי עוד החודש</span><b class="num">${nis(sum(planM,'in')-sum(planM,'out'))}</b><span class="note num">${planM.length} רישומים צפויים</span></div>`:''}
  </div>
  <section class="card"><div class="row between"><h2>חצי השנה האחרונה</h2><div class="legend"><span><i style="background:var(--fin-in)"></i>הכנסות</span><span><i style="background:var(--fin-out)"></i>הוצאות</span></div></div>
    <div class="chart" role="img" aria-label="הכנסות והוצאות לפי חודש">${data.map(d=>`<div class="mcol" tabindex="0" data-tip="${esc(mName(d.k))}|${nis(d.i)}|${nis(d.o)}|${nis(d.i-d.o)}"><div class="pair"><i style="height:${d.i/max*100}%;background:var(--fin-in)"></i><i style="height:${d.o/max*100}%;background:var(--fin-out)"></i></div></div>`).join('')}</div>
    <div class="mlab">${data.map(d=>`<span>${MONTHS[+d.k.slice(5)-1].slice(0,3)}׳</span>`).join('')}</div>
    <div class="tbl"><table><thead><tr><th>חודש</th><th>הכנסות</th><th>הוצאות</th><th>יתרה</th></tr></thead><tbody>${data.map(d=>`<tr><td>${mName(d.k)}</td><td class="amt">${nis(d.i)}</td><td class="amt">${nis(d.o)}</td><td class="amt"><b>${nis(d.i-d.o)}</b></td></tr>`).join('')}</tbody></table></div>
  </section>
  <div class="two">
    <section class="card"><h2>לפי קטגוריה · ${mName(mk)}</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))">${catBlock('in','הכנסות','fin-in')}${catBlock('out','הוצאות','fin-out')}</div></section>
    <section class="card"><h2>לפי פרויקט · ${yr}</h2>${Object.keys(byProj).length?`<div class="tbl"><table><thead><tr><th>פרויקט</th><th>הכנסות</th><th>הוצאות</th><th>יתרה</th></tr></thead><tbody>${Object.entries(byProj).sort((a,b)=>(b[1].i-b[1].o)-(a[1].i-a[1].o)).map(([k,v])=>`<tr><td>${k?esc(pname(k)):'כללי'}</td><td class="amt">${nis(v.i)}</td><td class="amt">${nis(v.o)}</td><td class="amt"><b>${nis(v.i-v.o)}</b></td></tr>`).join('')}</tbody></table></div>`:'<p class="note">אין עדיין רישומים השנה.</p>'}</section>
  </div>
  <section class="card"><div class="row between"><h2>רישומים · ${mName(mk)}</h2>
    <div class="row" role="group" aria-label="סוג">${[{k:'all',n:'הכול'},{k:'in',n:'הכנסות'},{k:'out',n:'הוצאות'}].map(x=>`<button class="chip" data-act="mtype" data-k="${x.k}" aria-pressed="${UI.mtype===x.k}">${x.n}</button>`).join('')}</div></div>
    ${rows.length?`<div class="tbl"><table><thead><tr><th>תאריך</th><th>תיאור</th><th>קטגוריה</th><th>פרויקט</th><th>סכום</th><th></th></tr></thead><tbody>
      ${rows.map(m=>`<tr class="${m.planned?'planned':''}"><td class="num">${shortDate(m.date)}</td><td>${esc(m.desc||'')}${m.planned?' <span class="tag waiting">צפוי</span>':''}${m.regId?' <span class="note">מההרשמות</span>':''}</td><td>${esc(m.cat||'')}</td><td>${esc(pname(m.project))}</td>
        <td class="amt ${m.type==='in'?'fin-in':'fin-out'}"><b>${m.type==='in'?'+':'−'}${nis(m.amount)}</b></td><td><button class="icon" data-act="edit-money" data-id="${m.id}" aria-label="עריכה">✎</button></td></tr>`).join('')}
    </tbody></table></div>`:`<div class="empty">${all.length?'אין רישומים בחודש הזה.':'עוד אין רישומים. הוסיפי הכנסה או הוצאה, או סמני תשלום בהרשמות והוא יירשם כאן.'}</div>`}
  </section>`;
}

function fitDlg(){const h=window.visualViewport?window.visualViewport.height:innerHeight;document.documentElement.style.setProperty('--vvh',Math.round(h)+'px')}

/* ---------- calendar + file export ---------- */
function stamp(date,time,addMin=0){const [y,m,d]=date.split('-').map(Number);const [h,mi]=(time||'00:00').split(':').map(Number);const x=new Date(y,m-1,d,h,mi+addMin);return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00'}
function details(t){return [DM[t.domain]?.n,pname(t.project),t.owner?'אחראית: '+t.owner:'',t.notes,safeUrl(t.link)].filter(Boolean).join(' · ')}
function gcal(t){
  const dates=t.time?stamp(t.date,t.time)+'/'+stamp(t.date,t.time,t.dur||60):t.date.replace(/-/g,'')+'/'+addDays(t.date,1).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&dates='+dates+'&ctz=Asia/Jerusalem&details='+encodeURIComponent(details(t));
}
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);
function buildICS(tasks){
  const now=stamp(today(),'00:00');
  const ev=tasks.map(t=>['BEGIN:VEVENT','UID:'+t.id+'@ashia-center','DTSTAMP:'+now,
    ...(t.time?['DTSTART;TZID=Asia/Jerusalem:'+stamp(t.date,t.time),'DTEND;TZID=Asia/Jerusalem:'+stamp(t.date,t.time,t.dur||60)]
      :['DTSTART;VALUE=DATE:'+t.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(t.date,1).replace(/-/g,'')]),
    'SUMMARY:'+icsEsc(t.title),'DESCRIPTION:'+icsEsc(details(t)),'CATEGORIES:'+icsEsc(DM[t.domain]?.n),'END:VEVENT'].join('\r\n'));
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ashia Center//HE','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n');
}
async function saveFile(filename,data,okMsg){

  if(!dl){toast('ההורדה לא זמינה כאן');return}

function exportCSV(){

});

document.addEventListener('focusout',e=>{if(e.target.id!=='aud-note')return;const v=e.target.value.trim(),ex=S.notes?.audience;if((ex?.text??AUD_DEFAULT)===v)return;put('notes',{...(ex||{}),id:'audience',text:v,updatedAt:Date.now()},true)});
document.addEventListener('toggle',e=>{if(e.target.id==='aud-box')ls.set('audOpen',e.target.open)},true);
document.addEventListener('focusout',e=>{if(e.target.id!=='day-note')return;const d=e.target.dataset.date,v=e.target.value.trim(),id='note-'+d,ex=S.daylog[id];
  if((ex?.text||'')===v)return; if(!v&&ex){del('daylog',id);return} if(v)put('daylog',{...(ex||{}),id,date:d,text:v,isNote:true,createdAt:ex?.createdAt||Date.now()},true)});
/* chart tooltip */
function showTip(el){hideTip();const [m,i,o,bal]=el.dataset.tip.split('|');const t=document.createElement('div');t.className='tip';t.id='tip';t.innerHTML=el.dataset.tk==='day'?`<b>${esc(m)}</b><br>רישומים ידניים ${esc(i)}<br>משימות שסומנו ${esc(o)}${+bal?`<br>${esc(bal)} דקות`:''}`:`<b>${esc(m)}</b><br>הכנסות ${esc(i)}<br>הוצאות ${esc(o)}<br>יתרה ${esc(bal)}`;el.appendChild(t)}
function hideTip(){$('#tip')?.remove()}
document.addEventListener('mouseover',e=>{const c=e.target.closest('.mcol');if(c&&!c.contains($('#tip')))showTip(c);else if(!c)hideTip()});
document.addEventListener('focusin',e=>{const c=e.target.closest('.mcol');if(c)showTip(c)});
document.addEventListener('focusout',hideTip);
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
(window.__gate||Promise.resolve()).then(boot);
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
